name: Check and deploy large sauna

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      destination:
        description: 'Куда отправить проверенную версию'
        required: true
        default: lab
        type: choice
        options: [lab, production]

permissions:
  contents: read

concurrency:
  group: sauna-${{ github.event_name }}-${{ github.ref }}-${{ inputs.destination || 'ci' }}
  cancel-in-progress: false

jobs:
  check:
    name: Tests and JAR
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Manual deployment is allowed only from main
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: corretto
          java-version: '8'
          cache: maven
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - run: python3 -m unittest discover -s tools/deployment -p 'test_*.py' -v
      - run: mvn -B -ntp -f backend/pom.xml clean verify -Dskip.frontend.build=true
      - name: Check packaged application and repository hygiene
        run: python3 tools/deployment/check_package.py
      - name: Describe tested artifact
        id: manifest
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/sauna-updater'))
        env:
          DEPLOY_TARGET: ${{ github.ref == 'refs/heads/codex/sauna-updater' && 'lab' || inputs.destination || 'production' }}
        run: python3 tools/deployment/make_manifest.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/sauna-updater'))
        with:
          name: large-sauna
          path: |
            backend/target/sauna_large.jar
            backend/target/manifest.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: test-reports
          path: backend/target/surefire-reports/*.xml
          retention-days: 7
    outputs:
      tag: ${{ steps.manifest.outputs.tag }}

  publish:
    name: Publish for server download
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/sauna-updater'))
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: large-sauna
          path: release
      - name: Publish only complete releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.check.outputs.tag }}
          DEPLOY_TARGET: ${{ github.ref == 'refs/heads/codex/sauna-updater' && 'lab' || inputs.destination || 'production' }}
        run: |
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --title "$RELEASE_TAG" --notes "Tested commit: $GITHUB_SHA. Target: $DEPLOY_TARGET. Automatic installation on the configured large sauna server."
          gh release upload "$RELEASE_TAG" release/sauna_large.jar release/manifest.json
          gh release edit "$RELEASE_TAG" --draft=false --latest=false
          echo '### Версия опубликована' >> "$GITHUB_STEP_SUMMARY"
          echo 'Проверки пройдены. Сервер заберёт и проверит JAR. Настроенный сервер установит релиз автоматически. Публикация не означает установку.' >> "$GITHUB_STEP_SUMMARY"
